version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install -r native-ui/docs/requirements.txt
    - cd native-ui && mkdocs build

sphinx:
  configuration: native-ui/docs/mkdocs.yml

python:
  install:
    - requirements: native-ui/docs/requirements.txt

