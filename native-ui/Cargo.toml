[package]
name = "notebook-native-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[dependencies]
# Window & GPU
winit = "0.30"
wgpu = "22.0"
pollster = "0.3"
raw-window-handle = "0.6"

# Rendering (vello stack)
vello = "0.3"
parley = "0.2"
peniko = "0.2"

# Math & utilities
glam = "0.29"
bytemuck = { version = "1.14", features = ["derive"] }

# Async & networking
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Text & markdown
pulldown-cmark = "0.12"

# PDF parsing and rendering
pdfium-render = { version = "0.8", default-features = false, features = ["thread_safe", "pdfium_latest", "image_024"] }

# SVG parsing
usvg = "0.40"
tiny-skia-path = "0.11"

# Error handling & logging
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# Native file dialogs
rfd = "0.15"

# OS clipboard (text only; disable default image-data to avoid heavy `image` crate / rustc version pins)
arboard = { version = "3", default-features = false }
